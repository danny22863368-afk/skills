<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
</head>
<body>
<title>Danny 健身教練</title>
<style>
/* ============ 設計 tokens:延續課表的 IPF 槓片視覺 ============ */
:root{
  --paper:#FAFAF7; --card:#FFFFFF; --ink:#16181D; --muted:#6B6E76;
  --line:#D9D9D2; --soft:#F0F0EA; --soft2:#F7F7F2;
  --red:#C8102E; --blue:#0057B8; --yellow:#E0A800; --green:#00843D;
  --yellow-text:#8A6A00;
  --good:#00843D; --warn:#B87400; --bad:#C8102E;
  --shadow:0 1px 0 rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#131318; --card:#1C1C23; --ink:#EDEDE8; --muted:#9A9DA6;
    --line:#33343C; --soft:#22232A; --soft2:#1A1A20;
    --red:#F0546A; --blue:#4E8FE0; --yellow:#B8860B; --green:#2FA45F;
    --yellow-text:#D9A420;
    --good:#2FA45F; --warn:#D9A420; --bad:#F0546A;
    --shadow:none;
  }
}
:root[data-theme="light"]{
  --paper:#FAFAF7; --card:#FFFFFF; --ink:#16181D; --muted:#6B6E76;
  --line:#D9D9D2; --soft:#F0F0EA; --soft2:#F7F7F2;
  --red:#C8102E; --blue:#0057B8; --yellow:#E0A800; --green:#00843D;
  --yellow-text:#8A6A00; --good:#00843D; --warn:#B87400; --bad:#C8102E;
  --shadow:0 1px 0 rgba(0,0,0,.04);
}
:root[data-theme="dark"]{
  --paper:#131318; --card:#1C1C23; --ink:#EDEDE8; --muted:#9A9DA6;
  --line:#33343C; --soft:#22232A; --soft2:#1A1A20;
  --red:#F0546A; --blue:#4E8FE0; --yellow:#B8860B; --green:#2FA45F;
  --yellow-text:#D9A420; --good:#2FA45F; --warn:#D9A420; --bad:#F0546A;
  --shadow:none;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--paper)}
body{
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:15.5px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 96px}

/* ============ Header ============ */
header.app{
  max-width:560px;margin:0 auto;padding:18px 14px 12px;
  display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--ink);
}
.h-title{flex:1;min-width:0}
.h-title .eyebrow{
  font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;
}
.h-title h1{font-size:21px;font-weight:900;line-height:1.25;letter-spacing:-.01em}
.plate{width:30px;height:30px;border-radius:50%;border:5px solid var(--muted);position:relative;flex-shrink:0}
.plate::after{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--paper);border:2px solid rgba(0,0,0,.15)}
.iconbtn{
  background:none;border:1.5px solid var(--line);color:var(--ink);width:38px;height:38px;
  font-size:17px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
}
.iconbtn:hover{border-color:var(--ink)}

/* ============ 通用元件 ============ */
section.block{margin-top:22px}
h2.blk{
  font-size:17px;font-weight:900;margin-bottom:4px;display:flex;align-items:center;gap:8px;
}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:12px}
.card{border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.chip{
  display:inline-block;font-weight:700;font-size:12.5px;padding:1px 8px;
  border:1.5px solid var(--ink);white-space:nowrap;
}
.btn{
  font:inherit;font-weight:700;font-size:14px;cursor:pointer;
  border:2px solid var(--ink);background:var(--ink);color:var(--paper);
  padding:9px 14px;
}
.btn.ghost{background:none;color:var(--ink)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.tag{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
input[type=text],input[type=number],input[type=password],select{
  font:inherit;color:var(--ink);background:var(--card);
  border:1.5px solid var(--line);padding:8px 10px;width:100%;
}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}

/* ============ 今日訓練 ============ */
.day-banner{
  margin-top:18px;padding:14px 16px;border:2px solid var(--ink);
  display:flex;align-items:center;gap:12px;background:var(--card);
}
.day-banner .plate{width:34px;height:34px}
.day-banner b{font-size:17px;font-weight:900;display:block;line-height:1.3}
.day-banner span{font-size:13px;color:var(--muted)}
.verdict{margin-top:14px;padding:14px 16px;border-left:4px solid var(--muted)}
.verdict.good{border-left-color:var(--good);background:color-mix(in srgb,var(--good) 8%,var(--card))}
.verdict.warn{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--card))}
.verdict.bad{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--card))}
.verdict b{font-size:15px}
.verdict .detail{font-size:13px;color:var(--muted);margin-top:2px}
.exc{margin-top:14px;overflow:hidden}
.exc-head{padding:12px 14px;display:flex;align-items:flex-start;gap:10px}
.exc-head .no{
  font-weight:900;font-size:13px;width:22px;height:22px;flex-shrink:0;margin-top:2px;
  display:flex;align-items:center;justify-content:center;border:1.5px solid var(--ink);
}
.exc-title{flex:1;min-width:0}
.exc-title b{font-size:15.5px;font-weight:800;display:block}
.exc-title .meta{font-size:12.5px;color:var(--muted)}
.exc-done{font-size:12px;font-weight:800;white-space:nowrap;margin-top:3px}
.suggest{
  margin:0 14px;padding:9px 12px;background:var(--soft);border:1px dashed var(--line);
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
}
.suggest .w{font-size:19px;font-weight:900}
.suggest .why{font-size:12px;color:var(--muted);flex:1;min-width:120px}
.sets{padding:10px 14px 4px;display:flex;flex-wrap:wrap;gap:6px}
.setpill{
  font-size:12.5px;font-weight:700;padding:3px 9px;border:1.5px solid var(--green);
  color:var(--good);
}
.logrow{display:flex;gap:8px;padding:8px 14px 14px;align-items:stretch}
.step{display:flex;border:1.5px solid var(--line);flex:1;min-width:0}
.step button{
  font:inherit;font-weight:800;background:var(--soft);border:none;color:var(--ink);
  width:34px;cursor:pointer;flex-shrink:0;
}
.step .val{flex:1;min-width:0;text-align:center;align-self:center;font-weight:800;font-size:14.5px}
.step .val small{display:block;font-weight:500;font-size:10.5px;color:var(--muted);line-height:1.1}
.exc-foot{padding:0 14px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.linky{background:none;border:none;color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;text-decoration:underline;padding:2px}
.alts{margin:0 14px 12px;padding:10px 12px;background:var(--soft2);border:1px solid var(--line);font-size:13px}
.alts b{font-size:12px;letter-spacing:.06em;color:var(--muted);display:block;margin-bottom:2px}
.restday{
  margin-top:16px;padding:22px 18px;border:1px dashed var(--line);color:var(--muted);
  font-size:14px;background:var(--card);
}
.restday b{color:var(--ink);font-size:16px;display:block;margin-bottom:4px}

/* ============ 休息計時器 ============ */
#timer{
  position:fixed;left:0;right:0;bottom:64px;z-index:40;display:none;
}
#timer.on{display:block}
#timer .tin{
  max-width:560px;margin:0 auto;background:var(--ink);color:var(--paper);
  padding:10px 16px;display:flex;align-items:center;gap:14px;
}
#timer .t-num{font-size:26px;font-weight:900;min-width:86px}
#timer .t-label{flex:1;font-size:12.5px;opacity:.8;line-height:1.3}
#timer button{
  font:inherit;font-weight:700;font-size:13px;background:none;color:var(--paper);
  border:1.5px solid color-mix(in srgb,var(--paper) 50%,transparent);padding:5px 10px;cursor:pointer;
}
#timer .t-bar{position:absolute;top:0;left:0;height:3px;background:var(--green);transition:width 1s linear}

/* ============ 課表 tab ============ */
.wk{margin-top:14px}
.wk .exrow{display:flex;gap:10px;padding:9px 14px;border-top:1px solid var(--line);font-size:13.5px;align-items:baseline}
.wk .exrow:first-of-type{border-top:none}
.wk .exrow .nm{flex:1}
.wk .exrow .nm small{color:var(--muted);display:block;font-size:11.5px}
.wk .exrow .rx{font-weight:800;font-size:12.5px;white-space:nowrap}
.wk-head{padding:11px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.wk-head b{flex:1;font-size:15px;font-weight:900}
.wk-head .tag{font-weight:700}
details.wk summary{list-style:none;cursor:pointer}
details.wk summary::-webkit-details-marker{display:none}

/* ============ 飲食 ============ */
.meters{padding:14px}
.meter{margin-bottom:14px}
.meter:last-child{margin-bottom:2px}
.meter .mrow{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:4px}
.meter .mrow b{font-size:14px}
.meter .mrow .v{font-weight:800}
.meter .track{height:10px;background:var(--soft);position:relative;border:1px solid var(--line)}
.meter .fill{position:absolute;top:0;left:0;bottom:0;background:var(--ink)}
.meter .fill.ok{background:var(--good)}
.meter .fill.over{background:var(--warn)}
.meter .band{position:absolute;top:-3px;bottom:-3px;border-left:2px solid var(--good);opacity:.8}
.ai-zone{padding:14px}
.ai-zone .hintline{font-size:12.5px;color:var(--muted);margin-top:8px}
#aiPreview{max-width:100%;max-height:220px;border:1px solid var(--line);display:none;margin-top:10px}
.ai-result{margin-top:10px;border:1px solid var(--line)}
.ai-result .fr{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line);align-items:center;font-size:13.5px}
.ai-result .fr:first-child{border-top:none}
.ai-result .fr .fn{flex:1}
.ai-result .fr .fm{color:var(--muted);font-size:12px;white-space:nowrap}
.ai-err{margin-top:10px;padding:10px 12px;border-left:4px solid var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--card));font-size:13px}
.foodlist .fr{display:flex;gap:8px;padding:9px 14px;border-top:1px solid var(--line);align-items:center;font-size:13.5px}
.foodlist .fr .fn{flex:1;min-width:0}
.foodlist .fr .fn small{display:block;color:var(--muted);font-size:11.5px}
.foodlist .fr .fp{font-weight:800;white-space:nowrap}
.foodlist .fr .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:2px 4px}
.dbsearch{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px}
.dbhits{max-height:250px;overflow-y:auto}
.dbhits .hit{display:flex;gap:8px;padding:8px 14px;border-top:1px solid var(--line);align-items:center;font-size:13.5px;cursor:pointer}
.dbhits .hit:hover{background:var(--soft2)}
.dbhits .hit .fm{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}

/* ============ 數據 ============ */
.vol{padding:12px 14px}
.vrow{display:grid;grid-template-columns:52px 1fr 74px;gap:10px;align-items:center;margin-bottom:9px;font-size:13px}
.vrow .vn{font-weight:700}
.vrow .track{height:12px;background:var(--soft);position:relative;border:1px solid var(--line)}
.vrow .fill{position:absolute;top:0;left:0;bottom:0}
.vrow .band{position:absolute;top:-3px;bottom:-3px;background:color-mix(in srgb,var(--good) 18%,transparent);border-left:1.5px dashed var(--good);border-right:1.5px dashed var(--good)}
.vrow .vv{font-size:12.5px;color:var(--muted);text-align:right}
.chart-card{margin-top:14px}
.chart-card .ch-head{padding:11px 14px 0;display:flex;gap:8px;align-items:baseline}
.chart-card .ch-head b{font-size:14.5px;font-weight:900}
.chart-card .ch-head span{font-size:12px;color:var(--muted)}
.chart-card svg{display:block;width:100%;height:auto}
.empty{padding:18px 14px;color:var(--muted);font-size:13.5px;text-align:center}

/* ============ Tab bar ============ */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--card);border-top:2px solid var(--ink);
}
nav.tabs .tin{max-width:560px;margin:0 auto;display:flex}
nav.tabs button{
  flex:1;font:inherit;background:none;border:none;color:var(--muted);
  padding:9px 4px calc(9px + env(safe-area-inset-bottom));cursor:pointer;
  font-size:11.5px;font-weight:700;letter-spacing:.02em;
}
nav.tabs button .ic{display:block;font-size:19px;line-height:1.2}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on .ic{transform:translateY(-1px)}

/* ============ Modal ============ */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .m-in{background:var(--paper);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-top:3px solid var(--ink);padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.m-in h3{font-size:17px;font-weight:900;margin-bottom:12px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.fld .note{font-size:11.5px;color:var(--muted);margin-top:3px}

.view{display:none}
.view.on{display:block}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="app">
  <div class="plate" id="hPlate"></div>
  <div class="h-title">
    <div class="eyebrow" id="hDate">—</div>
    <h1 id="hTitle">健身教練</h1>
  </div>
  <button class="iconbtn" id="btnSettings" aria-label="設定">⚙</button>
</header>

<div class="wrap">
  <main id="viewToday" class="view on"></main>
  <main id="viewPlan" class="view"></main>
  <main id="viewFood" class="view"></main>
  <main id="viewStats" class="view"></main>
</div>

<div id="timer" role="timer">
  <div class="tin">
    <div class="t-bar" id="tBar"></div>
    <div class="t-num num" id="tNum">0:00</div>
    <div class="t-label" id="tLabel">組間休息</div>
    <button id="tPlus">+30s</button>
    <button id="tStop">結束</button>
  </div>
</div>

<nav class="tabs" aria-label="主選單">
  <div class="tin">
    <button data-v="Today" class="on"><span class="ic">🏋️</span>今日</button>
    <button data-v="Plan"><span class="ic">📋</span>課表</button>
    <button data-v="Food"><span class="ic">🍱</span>飲食</button>
    <button data-v="Stats"><span class="ic">📈</span>數據</button>
  </div>
</nav>

<div class="modal" id="modal"><div class="m-in" id="modalIn"></div></div>

<script>
'use strict';
/* ================= 資料層 ================= */
const LS_KEY = 'danny-fit-v1';
const S = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem(LS_KEY)); if(s && s.logs) return s; }catch(e){}
  return { logs:{}, food:{}, set:{ key:'', kcal:2600, p:120, c:320, f:75, bw:68 } };
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ================= 課表資料(來自 Danny 一週四練課表)================= */
/* unit: bar=槓鈴總重kg / db=啞鈴每手kg / mc=器械kg / bw=自重(重量欄=附加負重) */
const EX = {
  bench:    {n:'槓鈴臥推',    hint:'當日主項,重量最重',   m:'胸',   sets:4, lo:6,  hi:8,  rest:165, start:40, inc:2.5, unit:'bar', alts:['啞鈴平板臥推','史密斯臥推','胸推機']},
  incline:  {n:'上斜啞鈴臥推', hint:'上胸',               m:'胸',   sets:3, lo:8,  hi:12, rest:120, start:14, inc:2,   unit:'db',  alts:['上斜槓鈴臥推','上斜胸推機','低位繩索夾胸']},
  latpull:  {n:'滑輪下拉',    hint:'背闊肌',             m:'背',   sets:3, lo:8,  hi:12, rest:120, start:45, inc:5,   unit:'mc',  alts:['輔助引體向上','直臂下拉','單臂滑輪下拉']},
  row_s:    {n:'坐姿划船',    hint:'中背厚度',           m:'背',   sets:3, lo:10, hi:12, rest:90,  start:40, inc:5,   unit:'mc',  alts:['胸支撐划船','單臂啞鈴划船','T槓划船']},
  lateral:  {n:'側平舉',      hint:'中三角肌',           m:'肩',   sets:3, lo:12, hi:15, rest:75,  start:7,  inc:1,   unit:'db',  alts:['繩索側平舉','機械側平舉']},
  pushdown: {n:'三頭下壓',    hint:'肱三頭肌',           m:'三頭', sets:3, lo:10, hi:12, rest:60,  start:20, inc:2.5, unit:'mc',  alts:['過頭繩索伸展','窄握臥推','雙槓撐體']},
  squat:    {n:'槓鈴深蹲',    hint:'當日主項',           m:'股四', sets:4, lo:6,  hi:8,  rest:180, start:50, inc:2.5, unit:'bar', alts:['高背槓深蹲','箱上蹲','腿推機(加重)']},
  rdl:      {n:'羅馬尼亞硬舉', hint:'腿後鏈',             m:'腿後', sets:3, lo:8,  hi:10, rest:150, start:50, inc:2.5, unit:'bar', alts:['啞鈴RDL','背伸展','早安體前屈']},
  legpress: {n:'腿推機',      hint:'股四頭',             m:'股四', sets:3, lo:10, hi:12, rest:120, start:90, inc:10,  unit:'mc',  alts:['哈克深蹲','啞鈴分腿蹲']},
  legcurl:  {n:'俯臥腿彎舉',  hint:'腿後孤立',           m:'腿後', sets:3, lo:10, hi:12, rest:90,  start:30, inc:5,   unit:'mc',  alts:['坐姿腿彎舉','瑞士球腿彎舉']},
  calf:     {n:'站姿提踵',    hint:'小腿',               m:'小腿', sets:4, lo:12, hi:15, rest:60,  start:40, inc:5,   unit:'mc',  alts:['坐姿提踵','腿推機提踵']},
  pullup:   {n:'引體向上',    hint:'做不到可用輔助機或彈力帶', m:'背', sets:4, lo:6, hi:10, rest:150, start:0, inc:2.5, unit:'bw', alts:['滑輪下拉 4×8–10','離心引體(慢降5秒)','輔助引體機']},
  bbrow:    {n:'槓鈴划船',    hint:'中背主項',           m:'背',   sets:4, lo:8,  hi:10, rest:150, start:40, inc:2.5, unit:'bar', alts:['胸支撐划船','Pendlay 划船']},
  dbbench:  {n:'啞鈴平板臥推', hint:'胸',                 m:'胸',   sets:3, lo:8,  hi:12, rest:120, start:16, inc:2,   unit:'db',  alts:['槓鈴臥推','機械胸推']},
  pec:      {n:'蝴蝶機夾胸',  hint:'胸孤立',             m:'胸',   sets:3, lo:12, hi:15, rest:75,  start:35, inc:5,   unit:'mc',  alts:['繩索夾胸','啞鈴飛鳥']},

/* ================= 訓練邏輯 ================= */
function lastSession(exId){
  const dates = Object.keys(S.logs).filter(d => d !== today() && S.logs[d][exId] && S.logs[d][exId].length).sort().reverse();
  if(!dates.length) return null;
  return { date: dates[0], sets: S.logs[dates[0]][exId] };
}
/* 重量建議:漸進超負荷 —— 上次全組達到次數上限 → 加重;有一組低於下限 → 維持鞏固 */
function suggest(exId){
  const ex = EX[exId];
  const hist = lastSession(exId);
  if(!hist){
    if(ex.unit==='bw') return {w:0, note:'先做自重,行有餘力再負重', trend:'new'};
    return {w:ex.start, note:'建議起始重量,以能標準完成為準', trend:'new'};
  }
  const w = Math.max(...hist.sets.map(s=>s.w));
  const enough = hist.sets.length >= ex.sets;
  const allTop = enough && hist.sets.every(s=>s.r >= ex.hi);
  const anyLow = hist.sets.some(s=>s.r < ex.lo);
  const d = hist.date.slice(5).replace('-','/');
  if(allTop && ex.inc>0) return {w:+(w+ex.inc).toFixed(1), note:`上次(${d})全數達標 → 加重 ${ex.inc} kg`, trend:'up'};
  if(anyLow) return {w, note:`上次(${d})有組數未達下限 → 維持重量鞏固`, trend:'hold'};
  return {w, note:`維持 ${w}${UNIT_LABEL[ex.unit]},往次數上限 ${ex.hi} 下推進`, trend:'push'};
}
function todayLog(exId){ const t=S.logs[today()]; return (t && t[exId]) || []; }
function addSet(exId, w, r){
  const t = today();
  if(!S.logs[t]) S.logs[t]={};
  if(!S.logs[t][exId]) S.logs[t][exId]=[];
  S.logs[t][exId].push({w:+w, r:+r});
  save();
}
function undoSet(exId){
  const t=today();
  if(S.logs[t] && S.logs[t][exId]){ S.logs[t][exId].pop(); if(!S.logs[t][exId].length) delete S.logs[t][exId]; save(); }
}
/* 本週(週一起算)每個肌群完成組數 */
function weekVolume(){
  const now = new Date();
  const mon = new Date(now); mon.setDate(now.getDate() - ((now.getDay()+6)%7)); mon.setHours(0,0,0,0);
  const vol = {};
  for(const d in S.logs){
    const dt = new Date(d+'T12:00:00');
    if(dt >= mon && dt <= now){
      for(const exId in S.logs[d]){
        const m = EX[exId] ? EX[exId].m : null;
        if(m){ vol[m] = (vol[m]||0) + S.logs[d][exId].length; }
      }
    }
  }
  return vol;
}
/* 今日充足度 */
function adequacy(){
  const p = PROGRAM[new Date().getDay()];
  if(!p) return null;
  let planned=0, done=0, doneEx=0;
  p.list.forEach(id=>{
    planned += EX[id].sets;
    const n = todayLog(id).length;
    done += Math.min(n, EX[id].sets);
    if(n >= EX[id].sets) doneEx++;
  });
  const pct = planned ? Math.round(done/planned*100) : 0;
  let cls='bad', title='今日訓練量不足';
  if(pct>=100){ cls='good'; title='今日訓練充足,收工!'; }
  else if(pct>=90){ cls='good'; title='今日訓練大致充足'; }
  else if(pct>=55){ cls='warn'; title='還差一點,再撐幾組'; }
  return {pct, done, planned, doneEx, total:p.list.length, cls, title};
}

function bindToday(p){
  document.querySelectorAll('.exc').forEach(card=>{
    const id = card.dataset.ex, ex = EX[id];
    const wEl = card.querySelector('[data-f=w]'), rEl = card.querySelector('[data-f=r]');
    card.addEventListener('click', e=>{
      const a = e.target.closest('[data-a]'); if(!a) return;
      const act = a.dataset.a;
      const step = ex.inc || 1;
      if(act==='w-') wEl.textContent = Math.max(0, +(+wEl.textContent - step).toFixed(1));
      if(act==='w+') wEl.textContent = +(+wEl.textContent + step).toFixed(1);

      if(act==='r+') rEl.textContent = +rEl.textContent + 1;

      if(act==='timer'){ startTimer(ex.rest, ex.n+' 組間休息'); }
      if(act==='undo'){ undoSet(id); renderToday(); }
      if(act==='log'){
        addSet(id, +wEl.textContent, +rEl.textContent);

        if(done < ex.sets) startTimer(ex.rest, ex.n+' 組間休息('+done+'/'+ex.sets+' 組)');

      }
    });
  });
}

let tHandle=null, tLeft=0, tTotal=0;
function startTimer(sec, label){
  clearInterval(tHandle);
  tLeft=sec; tTotal=sec;
  $('#tLabel').textContent = label||'組間休息';
  $('#timer').classList.add('on');
  tick();
  tHandle = setInterval(tick, 1000);
}
function tick(){
  const mm = Math.floor(tLeft/60), ss = String(tLeft%60).padStart(2,'0');
  $('#tNum').textContent = mm+':'+ss;
  $('#tBar').style.width = (tTotal? (100 - tLeft/tTotal*100) : 0)+'%';
  if(tLeft<=0){
    clearInterval(tHandle);
    beep();
    if(navigator.vibrate) navigator.vibrate([200,100,200,100,400]);
    $('#tLabel').textContent='休息結束,下一組!';
    setTimeout(()=>$('#timer').classList.remove('on'), 4000);
    return;
  }
  tLeft--;
}
$('#tStop').addEventListener('click', ()=>{ clearInterval(tHandle); $('#timer').classList.remove('on'); });
$('#tPlus').addEventListener('click', ()=>{ tLeft+=30; tTotal+=30; });
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,.25,.5].forEach(t=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=880; g.gain.setValueAtTime(.3, ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+t+.2);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.22);
    });
  }catch(e){}
}

/* ================= 飲食 ================= */
function meterHtml(name, val, target, unit, band){
  const pct = Math.min(100, val/target*100);
  const over = val > target*1.25;
  const ok = band ? val>=target : (val>=target*0.9 && !over);
  return `<div class="meter">
    <div class="mrow"><b>${name}</b><span class="v num">${Math.round(val)} <span class="tag">/ ${target} ${unit}</span></span></div>
    <div class="track"><div class="fill ${ok?'ok':''}${over?' over':''}" style="width:${pct}%"></div>${band?`<div class="band" style="left:100%"></div>`:''}</div>
  </div>`;
}

      <div class="card meters">

function bindFood(){
  /* 刪除 */
  document.querySelectorAll('.foodlist .del').forEach(b=>b.addEventListener('click', ()=>{
    S.food[today()].splice(+b.dataset.i,1); save(); renderFood();
  }));
  /* 搜尋 */
  const fq=$('#fq'), hits=$('#fhits');
  const show = q=>{
    const r = FOOD_DB.filter(f=>!q || f.n.includes(q)).slice(0, q?12:8);
    hits.innerHTML = r.map((f,i)=>`<div class="hit" data-n="${esc(f.n)}"><span>${esc(f.n)}</span><span class="fm num">${f.u==='g'?'每100g':'每'+(f.note||'份')} · ${f.kcal} kcal · P${f.p}g</span></div>`).join('');
    hits.querySelectorAll('.hit').forEach(h=>h.addEventListener('click', ()=>foodQtyModal(FOOD_DB.find(x=>x.n===h.dataset.n))));
  };
  fq.addEventListener('input', ()=>show(fq.value.trim()));
  show('');
  /* AI */
  const file=$('#aiFile');
  $('#btnShot').addEventListener('click', ()=>file.click());
  file.addEventListener('change', ()=>{
    if(!file.files[0]) return;
    const img=$('#aiPreview');
    img.src = URL.createObjectURL(file.files[0]);
    img.style.display='block';
    $('#btnAiGo').disabled=false;
    $('#aiStatus').textContent='照片已載入,按「分析這張照片」開始。';
  });
  $('#btnAiGo').addEventListener('click', ()=>analyzePhoto(file.files[0]));
}
function foodQtyModal(f){
  openModal(`
    <h3>${esc(f.n)}</h3>

/* ---------- AI 拍照分析(Claude vision,BYOK)---------- */
async function analyzePhoto(fileObj){
  const st=$('#aiStatus'), out=$('#aiOut');
  out.innerHTML='';
  if(!S.set.key){
    out.innerHTML = `<div class="ai-err">尚未設定 API key。點右上角 ⚙ 設定,貼上你的 Anthropic API key(於 platform.claude.com 取得)。金鑰只儲存在這台裝置。</div>`;
    return;
  }
  st.textContent='🔍 AI 分析中,約需 10–20 秒…';
  $('#btnAiGo').disabled=true;
  try{
    const b64 = await shrinkImage(fileObj, 1120);
    const schema = {
      type:'object',
      properties:{
        foods:{type:'array', items:{type:'object', properties:{
          name:{type:'string', description:'食物名稱(繁體中文)'},
          portion:{type:'string', description:'估計份量描述,如 150g、1碗'},
          kcal:{type:'number'}, protein:{type:'number'}, carbs:{type:'number'}, fat:{type:'number'}
        }, required:['name','portion','kcal','protein','carbs','fat'], additionalProperties:false}},
        note:{type:'string', description:'一句話備註,如信心程度或建議'}
      },
      required:['foods','note'], additionalProperties:false
    };
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key': S.set.key,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model:'claude-opus-4-8',
        max_tokens: 2000,
        output_config:{format:{type:'json_schema', schema}},
        messages:[{role:'user', content:[
          {type:'image', source:{type:'base64', media_type:'image/jpeg', data:b64}},
          {type:'text', text:'這是一位台灣使用者的餐點照片。請辨識照片中每項食物,以台灣常見份量估算每項的重量與營養素(kcal、蛋白質、碳水、脂肪,單位公克)。份量不確定時取中間值。'}
        ]}]
      })
    });
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      throw new Error('API '+res.status+':'+(err.error&&err.error.message||'請檢查 API key 是否正確'));
    }
    const data = await res.json();
    if(data.stop_reason==='refusal') throw new Error('模型拒絕了這次請求,請換一張照片試試。');
    const text = (data.content.find(b=>b.type==='text')||{}).text;
    const parsed = JSON.parse(text);
    st.textContent='';
    renderAiResult(parsed);
  }catch(e){
    st.textContent='';
    let msg = esc(e.message||String(e));
    if(e instanceof TypeError){
      msg = '無法連線到 AI 服務。若你是在線上預覽版(Artifact)開啟,外部連線會被安全政策封鎖 —— 請改用 GitHub repo 裡的 <b>fitness-app/index.html</b> 存到手機/電腦後開啟,即可使用拍照分析。也可以先用下方「快速新增」手動記錄。';
    }
    $('#aiOut').innerHTML = `<div class="ai-err">${msg}</div>`;
  }finally{
    $('#btnAiGo').disabled=false;
  }
}
function shrinkImage(fileObj, maxSide){
  return new Promise((ok,bad)=>{
    const img=new Image();
    img.onload=()=>{
      const s=Math.min(1, maxSide/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      ok(c.toDataURL('image/jpeg',.82).split(',')[1]);
    };
    img.onerror=bad;
    img.src=URL.createObjectURL(fileObj);
  });
}
function renderAiResult(r){
  const out=$('#aiOut');
  if(!r.foods || !r.foods.length){ out.innerHTML='<div class="ai-err">照片中沒有辨識出食物,換個角度再拍一張?</div>'; return; }
  out.innerHTML = `
    <div class="ai-result">
      ${r.foods.map((f,i)=>`
        <div class="fr">
          <input type="checkbox" checked id="aif${i}">
          <label class="fn" for="aif${i}">${esc(f.name)} <span class="fm">${esc(f.portion)}</span></label>
          <span class="fm num">${Math.round(f.kcal)}kcal · P${Math.round(f.protein)} C${Math.round(f.carbs)} F${Math.round(f.fat)}</span>
        </div>`).join('')}
      <div class="fr" style="justify-content:flex-end;gap:10px">
        <span class="fm">${esc(r.note||'')}</span>
        <button class="btn small" id="aiAdd">加入勾選項目</button>
      </div>
    </div>`;
  $('#aiAdd').addEventListener('click', ()=>{
    r.foods.forEach((f,i)=>{
      if($('#aif'+i).checked) addFood({n:f.name, qLabel:f.portion, kcal:f.kcal, p:f.protein, c:f.carbs, f:f.fat});
    });
    renderFood();
  });
}

const MUSCLES = [
  {k:'胸',  band:[13,15]}, {k:'背',  band:[13,15]},
  {k:'股四'}, {k:'腿後'}, {k:'臀'}, {k:'肩'}, {k:'後肩'},
  {k:'二頭'}, {k:'三頭'}, {k:'小腿'}, {k:'核心'},
];
function renderStats(){
  const vol = weekVolume();
  const maxV = Math.max(20, ...Object.values(vol));
  const mains = [
    {id:'bench', color:'red'}, {id:'squat', color:'blue'}, {id:'dead', color:'green'}
  ];
  $('#viewStats').innerHTML = `
    <section class="block">
      <h2 class="blk">本週訓練量(組數/肌群)</h2>
      <div class="sub">週一起算。虛線區間 = 胸、背每週建議 13–15 組;一般肌群每週 10–20 組皆屬有效範圍。</div>
      <div class="card vol">
        ${MUSCLES.map(mu=>{
          const v = vol[mu.k]||0;
          const w = Math.min(100, v/maxV*100);
          const inBand = mu.band ? (v>=mu.band[0] && v<=mu.band[1]) : null;
          return `<div class="vrow">
            <span class="vn">${mu.k}</span>
            <div class="track">
              ${mu.band?`<div class="band" style="left:${mu.band[0]/maxV*100}%;width:${(mu.band[1]-mu.band[0])/maxV*100}%"></div>`:''}
              <div class="fill" style="width:${w}%;background:${inBand===true?'var(--good)':'var(--ink)'}"></div>
            </div>
            <span class="vv num">${v} 組${inBand===true?' ✓':(mu.band&&v>0?` / 目標${mu.band[0]}–${mu.band[1]}`:'')}</span>
          </div>`;
        }).join('')}
      </div>
    </section>
    <section class="block">
      <h2 class="blk">主項重量進展</h2>
      <div class="sub">每次訓練的最重一組。持續記錄就會看到往右上走的線。</div>
      ${mains.map(m=>liftChart(m.id, m.color)).join('')}
    </section>`;
}
function liftChart(exId, color){
  const ex = EX[exId];
  const hist = Object.keys(S.logs).sort().filter(d=>S.logs[d][exId]&&S.logs[d][exId].length)
    .map(d=>({d, w: Math.max(...S.logs[d][exId].map(s=>s.w))})).slice(-10);
  let body;
  if(hist.length < 2){
    body = `<div class="empty">${hist.length? '再記錄一次就會出現趨勢線':'還沒有紀錄 —— 完成第一次'+ex.n+'後就會出現在這裡'}</div>`;
  }else{
    const W=520, H=150, padL=10, padR=48, padT=18, padB=24;
    const ws = hist.map(h=>h.w);
    const lo = Math.min(...ws), hi = Math.max(...ws);
    const span = (hi-lo)||1;
    const x = i => padL + i*(W-padL-padR)/(hist.length-1);
    const y = w => padT + (H-padT-padB)*(1-(w-lo)/span);
    const pts = hist.map((h,i)=>`${x(i)},${y(h.w).toFixed(1)}`).join(' ');
    const last = hist[hist.length-1];
    body = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${ex.n}重量趨勢">
      <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="var(--line)" stroke-width="1"/>
      <polyline points="${pts}" fill="none" stroke="${CSS_COLOR[color]}" stroke-width="2" stroke-linejoin="round"/>
      ${hist.map((h,i)=>`<circle cx="${x(i)}" cy="${y(h.w).toFixed(1)}" r="${i===hist.length-1?5:3.5}" fill="${CSS_COLOR[color]}" stroke="var(--card)" stroke-width="2"><title>${h.d} · ${h.w} kg</title></circle>`).join('')}
      <text x="${x(hist.length-1)+9}" y="${(+y(last.w)+4).toFixed(1)}" font-size="13" font-weight="800" fill="var(--ink)" class="num">${last.w}kg</text>
      <text x="${padL}" y="${H-7}" font-size="10.5" fill="var(--muted)">${hist[0].d.slice(5)}</text>
      <text x="${W-padR}" y="${H-7}" font-size="10.5" fill="var(--muted)" text-anchor="end">${last.d.slice(5)}</text>
    </svg>`;
  }
  return `<div class="card chart-card">
    <div class="ch-head"><span style="display:inline-block;width:10px;height:10px;background:${CSS_COLOR[color]};margin-right:2px"></span><b>${ex.n}</b><span class="num">${hist.length? '最近 '+hist.length+' 次':''}</span></div>
    ${body}
  </div>`;
}
